name: Update Dashboard Data

on:
  repository_dispatch:
    types: [sheets-updated]
  schedule:
    # Every day at 04:00 AM Asia/Saigon = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery google-auth

      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > /tmp/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV

      - name: Update data
        run: |
          python scripts/update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "chile@chotot.vn"
          
          git add index.html data.json
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update $(date -u '+%Y-%m-%d')"
            git push
          fi

      # Each of the eight sections in update_dashboard.py catches its own errors
      # and republishes the previous day's values rather than taking the whole
      # dashboard down with it. That is deliberate, but it means a broken section
      # produces a green run and nobody hears about it: on 2026-08-22 and 08-23
      # the camp-detail query died on an upstream column rename and section 6
      # served 08-19 data for two days while the run reported success both times.
      #
      # This step exists to make that loud. It runs after the commit on purpose —
      # the sections that did work have already shipped by the time the run turns
      # red, so failing here costs nothing and buys the notification. `always()`
      # so it still reports when an earlier step failed for its own reasons.
      - name: Fail if any section served stale data
        if: always()
        run: |
          if [ -f /tmp/dashboard_skipped_sections.txt ]; then
            echo "These sections kept the previous data.json values:"
            cat /tmp/dashboard_skipped_sections.txt
            exit 1
          fi
          echo "All sections refreshed"
