name: Update Dashboard Data

on:
  repository_dispatch:
    types: [sheets-updated]
  schedule:
    # Every day at 4:00 AM Asia/Saigon = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Khởi tạo môi trường Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Chỉ cài đặt các thư viện Python (Đã xóa npm install lỗi)
      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery google-auth gspread

      # 3. Cấu hình quyền truy cập BigQuery công ty
      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_USER_CREDENTIALS }}' > /tmp/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV

      # 4. Chạy duy nhất script Python để kéo BigQuery + xử lý data (Đã xóa node build.js lỗi)
      - name: Update data
        run: |
          python scripts/update_dashboard.py

      # 5. Đẩy các file kết quả lên lại GitHub
      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "chile@chotot.vn"
          
          # Chỉ add các file thực sự tồn tại trong repo của bạn
          git add index.html data.json app-growth.html
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi
