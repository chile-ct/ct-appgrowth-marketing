name: Update Dashboard Data

on:
  repository_dispatch:
    types: [sheets-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Chỉ cần thiết lập Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Cài đặt các thư viện Python cần thiết
      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery google-auth gspread

      # 3. Cấu hình tài khoản GCP
      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_USER_CREDENTIALS }}' > /tmp/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV

      # 4. Chạy script Python để cập nhật dữ liệu (Đã bỏ node build.js thừa)
      - name: Update data
        run: |
          python scripts/update_dashboard.py

      # 5. Lưu lại thay đổi và push lên GitHub (Đã sửa lại đường dẫn các file thực tế của bạn)
      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "chile@chotot.vn"
          
          # Chỉ theo dõi các file thực sự tồn tại trong repo của bạn
          git add data.json index.html app-growth.html
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: auto-update $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi
