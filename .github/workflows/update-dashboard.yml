name: Update Dashboard Data

on:
  repository_dispatch:
    types: [sheets-updated]
  schedule:
    # Every day at 04:00 AM Asia/Saigon = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery google-auth gspread

      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_USER_CREDENTIALS }}' > /tmp/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV

      - name: Update data
        run: |
          python scripts/update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "chile@chotot.vn"
          
          # FIX TẠI ĐÂY: Chỉ định chính xác các file thực tế cần lưu của bạn
          git add index.html data.json app-growth.html
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi
