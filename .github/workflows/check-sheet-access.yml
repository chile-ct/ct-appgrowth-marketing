name: Check Sheet Access (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Setup GCP credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > /tmp/gcp-creds.json

      - name: Show service account email
        run: |
          python - <<'PY'
          import json
          raw = open('/tmp/gcp-creds.json').read()
          print("RAW LENGTH:", len(raw))
          print("FIRST 40 CHARS:", repr(raw[:40]))
          try:
              info = json.loads(raw)
          except Exception as e:
              print("NOT JSON:", e)
              raise SystemExit
          print("TYPE OF ROOT:", type(info).__name__)
          print("KEYS:", sorted(info.keys()))
          print("type field:", info.get('type'))
          print("ACCOUNT:", info.get('account'))
          PY

      - name: Show granted OAuth scopes
        run: |
          python - <<'PY'
          import json, urllib.request
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          creds = Credentials.from_authorized_user_file('/tmp/gcp-creds.json')
          creds.refresh(Request())
          url = 'https://oauth2.googleapis.com/tokeninfo?access_token=' + creds.token
          with urllib.request.urlopen(url) as r:
              info = json.load(r)
          print("EMAIL:", info.get('email'))
          print("GRANTED SCOPES:")
          for s in sorted(info.get('scope', '').split()):
              print("  ", s)
          PY

      - name: Try reading raw_total via CSV export
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          SHEET_ID = '1eLdUTKfR9yHcUnnEfyIouZlCiVDPvR6yn3igxdoy8eE'
          GID = '2065956136'

          creds = Credentials.from_authorized_user_file('/tmp/gcp-creds.json')
          creds.refresh(Request())

          url = f'https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid={GID}'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + creds.token})
          try:
              with urllib.request.urlopen(req) as r:
                  body = r.read().decode('utf-8', 'replace')
              lines = body.splitlines()
              print("OK - read succeeded")
              print("TOTAL LINES:", len(lines))
              for line in lines[:3]:
                  print(line)
              print("LAST LINE:", lines[-1] if lines else '')
          except urllib.error.HTTPError as e:
              print("FAILED HTTP", e.code)
              print(e.read().decode('utf-8', 'replace')[:500])
          PY
