name: peek target tab
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q google-auth
      - name: Dump target tab
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/c.json
          python - <<'PY'
          import json, urllib.request, csv, io
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          info = json.load(open('/tmp/c.json'))
          creds = Credentials.from_authorized_user_info(info)
          creds.refresh(Request())
          url = ('https://docs.google.com/spreadsheets/d/'
                 '1eLdUTKfR9yHcUnnEfyIouZlCiVDPvR6yn3igxdoy8eE'
                 '/export?format=csv&gid=2028964073')
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+creds.token})
          text = urllib.request.urlopen(req, timeout=90).read().decode('utf-8','replace')
          rows = list(csv.reader(io.StringIO(text)))
          print('TOTAL ROWS:', len(rows))
          for i, r in enumerate(rows[:45]):
              cells = [c.strip() for c in (r + ['']*12)[:12]]
              print(f'{i:>3} | ' + ' | '.join(cells))
          PY
